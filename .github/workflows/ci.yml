name: ci

# Every push tests and builds the release binary; the artifact is what `bin/ci-take cli` (inir-eco) puts live, so
# nothing compiles on the maintainer's machine.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # Same build a release does, without publishing.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - run: dist/inir_linux_amd64_v1/inir cli version
      - name: The binary, for the maintainer's desktop
        run: |
          mkdir -p out && cp dist/inir_linux_amd64_v1/inir out/inir
          (cd out && sha256sum inir > inir.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: inir-linux-amd64
          retention-days: 30
          path: out/
